# One product of a scoped mica-build release, from a clean checkout of the caller's ref, on a
# hosted runner: the setup, the board's bundle out of this run's built components, the plan
# line of the product, the release build at its generation, the verification and the
# collection of its files and rows (src/release/scoped.ts). release.yml calls it per product and
# publishes what it uploads; ci.yml calls it with a fixture tag and no release history, and
# publishes nothing, so a release is never the first run of this path.
#
# SIGNING. The release trust material: the private keys are the repository secrets
# MICA_RELEASE_VERITY_KEY, MICA_RELEASE_BOOT_KEY and MICA_RELEASE_UPDATES_KEY, their
# public halves the repository variables MICA_VERITY_TRUST_CERT, MICA_BOOT_TRUST_CERT
# and MICA_UPDATES_PUBLIC_KEY, written to a private directory of the runner. The grade
# follows the certificates: MICA-development-* certificates write the development-grade
# marker the image reports; mixed grades are refused.

name: release-product

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      board:
        type: string
        required: true
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
      tag:
        description: the scoped release tag <scope>.<YYYYMMDD-HHMM>
        type: string
        required: true
      history:
        description: github (the GitHub Releases of micaoss/mica-build) or none (no earlier release)
        type: string
        required: true
      generation:
        description: the generation the caller planned; this job refuses to build at another one
        type: string
        required: false
        default: ''
      upload:
        description: upload the collected files and rows as the artifact release-<product>
        type: boolean
        required: true
      built:
        description: the output tars of the components this run built (kernel-<board>, uboot-<board>), the build-boards.yml `built` output, of this board or of every board; empty when every component is reused
        type: string
        required: false
        default: ''
    secrets:
      MICA_RELEASE_VERITY_KEY:
        required: true
      MICA_RELEASE_BOOT_KEY:
        required: true
      MICA_RELEASE_UPDATES_KEY:
        required: true

permissions:
  contents: read

env:
  MICA_BUILD_CONTAINER: "1"
  MICA_VERIFY_CONTAINER: "1"

jobs:
  product:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      # The pack stage exports the factory root as an OCI archive, which the
      # docker driver can do only over the containerd image store; the hosted
      # runners ship the classic store.
      - name: The containerd image store
        run: |
          set -euo pipefail
          config=/etc/docker/daemon.json
          { sudo cat "$config" 2>/dev/null || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' >"$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" "$config"
          sudo systemctl restart docker
          [ "$(docker info -f '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}')" = io.containerd.snapshotter.v1 ] ||
            { echo "error: docker did not come back on the containerd image store" >&2; docker info >&2; exit 1; }
      # The harness attaches its containers to the network named traefik.
      - name: The container network the harness attaches to
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      # The packaging tool images (src/boot/build-tools.ts, stages/boot/Dockerfile.fit) are
      # linux/amd64 on every runner, so their packager identity is one image;
      # on the arm64 runner they run under emulation. The root itself is
      # composed and executed natively.
      - name: Emulation for the linux/amd64 packaging tools
        if: inputs.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64
      - name: Restore the archives
        uses: actions/cache/restore@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
          key: pool-${{ inputs.arch }}-${{ hashFiles('locks/*.lock', 'locks/pins/*.pin') }}
      - name: The release trust material
        env:
          VERITY_KEY: ${{ secrets.MICA_RELEASE_VERITY_KEY }}
          VERITY_CERT: ${{ vars.MICA_VERITY_TRUST_CERT }}
          BOOT_KEY: ${{ secrets.MICA_RELEASE_BOOT_KEY }}
          BOOT_CERT: ${{ vars.MICA_BOOT_TRUST_CERT }}
          UPDATES_KEY: ${{ secrets.MICA_RELEASE_UPDATES_KEY }}
          UPDATES_PUBLIC: ${{ vars.MICA_UPDATES_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # Under the git-ignored _out/, inside the checkout the build containers mount at its own path.
          signing="$GITHUB_WORKSPACE/_out/release-signing"
          mkdir -p "$signing/verity" "$signing/boot" "$signing/updates"
          for pair in VERITY_KEY:verity/signer.key.pem VERITY_CERT:verity/signer.cert.pem BOOT_KEY:boot/signer.key.pem \
              BOOT_CERT:boot/signer.cert.pem UPDATES_KEY:updates/signer.key.pem UPDATES_PUBLIC:updates/public.key; do
            name="${pair%%:*}"
            [ -n "${!name}" ] || { echo "error: the release secret or variable for ${pair#*:} is not set" >&2; exit 1; }
            printf '%s\n' "${!name}" >"$signing/${pair#*:}"
          done
          grades=""
          for cert in verity boot; do
            case "$(docker run --rm --label ai-agent=true --network none -v "$signing/$cert/signer.cert.pem:/cert.pem:ro" "$(bash bin/bun.sh src/cli.ts from --ref mica-build-env:base)" \
                openssl x509 -in /cert.pem -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= *//p')" in
              MICA-development-*) grades="$grades development" ;;
              *) grades="$grades production" ;;
            esac
          done
          case "$grades" in
            " development development") printf 'DEVELOPMENT-GRADE\nDOMAINS=boot verity updates\n' >"$signing/GENERATED" ;;
            " production production") ;;
            *) echo "error: the verity and boot certificates are of different grades:$grades" >&2; exit 1 ;;
          esac
          echo "MICA_SIGNING_OUTPUT=$signing" >>"$GITHUB_ENV"
          echo "MICA_VERITY_TRUST_CERT=$signing/verity/signer.cert.pem" >>"$GITHUB_ENV"
      # The boards' packages of this architecture and the board's built components: the pool and the kernel and
      # U-Boot this run built (the build-boards.yml artifacts), unpacked under _out/; a component the run reused is
      # taken from the latest release by its digest (src/cli.ts board-pool --fetch).
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-{pool-${{ inputs.arch }},kernel-${{ inputs.board }},uboot-${{ inputs.board }}}'
          path: ${{ github.workspace }}/_out/ci/outputs
          merge-multiple: true
      - name: The boards' packages of this architecture, the board's bundle, and that it is a release target
        env:
          BUILT: ${{ inputs.built }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The pool artifact carries the boards' own packages; src/product/build.ts fetches the imported
          # archives beside them and indexes the whole pool. BUILT may name every board's components (ci.yml
          # builds all boards in one build-boards.yml run); only this board's are downloaded and expected.
          expected=()
          for c in ${BUILT}; do
            case "${c}" in kernel-${{ inputs.board }}|uboot-${{ inputs.board }}) expected+=("${c}") ;; esac
          done
          bash bin/bun.sh src/cli.ts ci-outputs unpack "${GITHUB_WORKSPACE}/_out/ci/outputs" pool-${{ inputs.arch }} "${expected[@]}"
          bash bin/bun.sh src/cli.ts board-pool --fetch "${{ inputs.board }}"
          grep -qx 'BOARD_RELEASE_TARGET=1' "_out/boards/${{ inputs.board }}/board.env" ||
            { echo "error: board ${{ inputs.board }} is not a release target; a release of ${{ inputs.product }} is refused" >&2; exit 1; }
      # This job plans again, so it reads the same generation floor as the caller's plan job; a floor set for one
      # and not the other is how the two plans disagreed once, silently, and the guard below is why that is now
      # loud: the caller passes the generation it planned, and a build never runs at another one.
      - name: The plan line of ${{ inputs.product }} in ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY: ${{ inputs.history }}
          TAG: ${{ inputs.tag }}
          PRODUCT: ${{ inputs.product }}
          PLANNED: ${{ inputs.generation }}
          MICA_RELEASE_GENERATIONS: ${{ vars.MICA_RELEASE_GENERATIONS }}
        run: |
          set -euo pipefail
          mkdir -p _out/plan
          case "$HISTORY" in
            github) ;;
            none) mkdir -p _out/no-history; export MICA_RELEASE_HISTORY="$PWD/_out/no-history" ;;
            *) echo "error: history must be github or none, not $HISTORY" >&2; exit 1 ;;
          esac
          bash bin/bun.sh src/cli.ts scoped-release plan "$TAG" | awk -F'\t' -v p="$PRODUCT" '$1 == p' >_out/plan/plan.tsv
          [ -s _out/plan/plan.tsv ] || { echo "error: the plan of $TAG names no $PRODUCT" >&2; exit 1; }
          cat _out/plan/plan.tsv
          generation="$(cut -f3 _out/plan/plan.tsv)"
          [ -z "$PLANNED" ] || [ "$generation" = "$PLANNED" ] ||
            { echo "error: this job plans $PRODUCT at generation $generation and its caller planned $PLANNED" >&2; exit 1; }
          echo "GENERATION=$generation" >>"$GITHUB_ENV"
      - name: Build ${{ inputs.product }} as release ${{ inputs.tag }}
        env:
          TAG: ${{ inputs.tag }}
        run: bash bin/bun.sh src/cli.ts product-build "${{ inputs.product }}" --release "${TAG#*.}" --generation "$GENERATION"
      - name: Verify its image against the contract
        run: bash bin/bun.sh src/cli.ts product-build "${{ inputs.product }}" --verify
      # THE ONE GATE THAT ASKS WHETHER THE THING STARTS. Everything above reads
      # the image; this boots it, reaches mica-runkit as PID 1 and requires the
      # guest's own pass marker. On 2026-09-16 four boards were renamed, the
      # pinned client kept the old names, and every uefi image published for the
      # next three days refused its own board name at PID 1 and powered the
      # device off -- through a CI that was green, because until this step
      # NOTHING IN CI OR RELEASE HAD EVER BOOTED AN IMAGE. The boot is about
      # three quarters of a minute; the lab images it builds first cost a minute
      # on a cold runner and cache after that.
      #
      # It took three red runs to land, every one of them a defect in the
      # HARNESS and none in the image: files made by a container, root-owned,
      # then touched from the host -- correct on the root host this suite had
      # only ever run on, "Permission denied" for the runner user. They are
      # fixed, and the suite is now proven under a non-root user locally, which
      # is the check that should have come first.
      #
      # COVERAGE, STATED SO NOBODY TRUSTS IT FOR MORE: this boots the amd64
      # product alone, so it covers the UEFI amd64 path. mica-deploy has an
      # arm64-specific arm (the BOOTAA64.EFI target), and a break confined to it
      # would pass here green. The hosted arm64 runners expose no KVM, so an
      # arm64 guest is TCG exactly as this one is and the second boot is a
      # decision about minutes rather than about capability: if the arm64 path
      # ever breaks while this stays green, that is the day to add it.
      #
      # AND NOTHING COVERS A FIT BOARD, HERE OR ANYWHERE IN THIS TREE. Both
      # suites that boot refuse one by name -- tests/suites/apid-api/src/qemu.ts and
      # tests/suites/lifecycle-uefi/product-inputs.sh -- and tests/suites/lifecycle-uboot-fit,
      # whose name reads like their FIT counterpart, boots nothing: it checks
      # firmware records, signature refusal and trust from the host. So of the
      # eight published products, the four on cx3576 and s905x5m have never been
      # started by anything. Writing a FIT boot suite is unscoped work and a
      # user decision, not a gap to be quietly filled here.
      - name: Boot it, one runtime stage, no faults
        if: inputs.arch == 'amd64'
        run: bash tests/suites/lifecycle-uefi/run.sh "${{ inputs.product }}" --runtime-only
      # AND THEN IT USES THE SYSTEM, which no gate did until 2026-09-20. The step
      # above proves the guest starts; this one logs in through PAM, runs a
      # container, reads the image's own name off the console and checks that
      # the boot settled. Three of its seven claims would have caught the defect
      # that shipped a root whose /etc/pam.d could not assemble -- on every
      # board, through a CI that was green, until a person met it at a console.
      # It inherits the amd64 condition above, so it costs its two minutes on
      # the same one product that job already booted.
      - name: Let it check itself from inside, the way a person would
        if: inputs.arch == 'amd64'
        run: bash tests/suites/session-probe/run.sh "${{ inputs.product }}"
      - name: Its release files and rows
        env:
          TAG: ${{ inputs.tag }}
        run: bash bin/bun.sh src/cli.ts scoped-release collect "${{ inputs.product }}" "$TAG" _out/plan/plan.tsv _out/release
      - uses: actions/upload-artifact@v7
        if: inputs.upload
        with:
          name: release-${{ inputs.product }}
          path: _out/release/
          if-no-files-found: error
          retention-days: 1
