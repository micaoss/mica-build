# A scoped mica-build release (mica:docs/decisions/2026-09-15-mica-build-scoped-releases.md,
# mica:docs/decisions/2026-09-21-mica-boards-merged-into-mica-build.md): the tag
# <scope>.<YYYYMMDD-HHMM> names a board (all its products) or one product; only that board and those
# products are built, verified and published. In order: the scope's board -- its kernel and U-Boot
# (build-boards.yml: a component whose inputs equal the latest release's is reused by digest, the
# others built natively), its pool with the package-version guard and the package gate -- published
# as pool.<board>.<arch>.<YYYYMMDD-HHMM> and <component>.<board>.<YYYYMMDD-HHMM> in
# ghcr.io/micaoss/mica-build and read back anonymously (make board-publish); then each product on
# the runner of its board's architecture (release-product.yml), taking the board's components out of
# this run; then the publish job pushes the product bundles image.<product>.<release> and
# update.<product>.<release>, writes mica-build.lock (mica:docs/design/release-lock.md 1.2.2: the
# board's pool, package and board rows, the input releases, the products and their assets) with
# SHA256SUMS listing only it, and attaches everything, the lock last, so a release carries either all
# of its assets or a failed run. tools/release.sh holds the product steps.
#
# CHANNEL. Every release targets the development channel: tools/product-build.sh
# --release assembles and gates its release directory with --channel
# development, and the release gate keeps refusing development-marked material
# on candidate and stable (user decision 2026-09-14).
#
# Triggered only by publishing a release (gh release create <scope>.<YYYYMMDD-HHMM>
# --target <commit of main>); it builds the tag the release names.
#
# SIGNING. The release signs with the deployment's trust material, written to a
# private directory of the runner: the private keys are the repository secrets
# MICA_RELEASE_VERITY_KEY, MICA_RELEASE_BOOT_KEY and MICA_RELEASE_UPDATES_KEY,
# their public halves the repository variables MICA_VERITY_TRUST_CERT,
# MICA_BOOT_TRUST_CERT and MICA_UPDATES_PUBLIC_KEY (tools/product-build.sh's
# verity/, boot/ and updates/ files). The kernels are built against that verity
# certificate, which trust-certificates.sha256 records. The grade follows the
# certificates: MICA-development-* certificates write the development-grade
# marker the image reports; mixed grades are refused.
#
# CACHES. A release restores the archive, source and prefix-stage caches that pushes to
# main saved, by exact key, and saves nothing; every restored file is hashed again by its
# reader, and a release builds the same without them.

name: release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MICA_BUILD_CONTAINER: "1"
  MICA_VERIFY_CONTAINER: "1"
  TAG: ${{ github.event.release.tag_name }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      board: ${{ steps.plan.outputs.board }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      # tools/release.sh plan refuses the scope mica: a Mica version index is cut by the index job below.
      - name: Every lock of locks/ is its release's
        run: make locks-verify
      # MICA_RELEASE_GENERATIONS is the repository variable that raises a planned generation for a product whose
      # published history this tree can no longer read; tools/release.sh refuses a floor below the planned
      # generation, so a stale one fails the release rather than lowering it. Unset it once its cut is done.
      - name: The products of the scope, their board, generations and previous releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MICA_RELEASE_GENERATIONS: ${{ vars.MICA_RELEASE_GENERATIONS }}
        run: |
          set -euo pipefail
          mkdir -p _out/plan
          bash tools/release.sh plan "${TAG}" >_out/plan/plan.tsv
          cat _out/plan/plan.tsv
          boards="$(cut -f2 _out/plan/plan.tsv | sort -u)"
          [ "$(printf '%s\n' "$boards" | grep -c .)" = 1 ] || { echo "error: the scope's products name more than one board: $boards" >&2; exit 1; }
          echo "board=$boards" >>"$GITHUB_OUTPUT"
          while IFS=$'\t' read -r product board generation _; do
            arch="$(bash bin/bun.sh src/cli.ts boards arch "$board")"
            case "$arch" in
              amd64) runner=ubuntu-24.04 ;;
              arm64) runner=ubuntu-24.04-arm ;;
              *) echo "error: boards/boards.tsv names no architecture of $board" >&2; exit 1 ;;
            esac
            jq -nc --arg p "$product" --arg b "$board" --arg a "$arch" --arg r "$runner" --arg g "$generation" '{product: $p, board: $b, arch: $a, runner: $r, generation: $g}'
          done <_out/plan/plan.tsv | jq -sc '{include: .}' | sed 's/^/matrix=/' >>"$GITHUB_OUTPUT"

  # The scope's board: its kernel and U-Boot (built or reused), its pool and the package gates.
  board:
    needs: plan
    uses: ./.github/workflows/build-boards.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name }}
      board: ${{ needs.plan.outputs.board }}
      release: ${{ github.event.release.tag_name }}

  # The board's pool and built components, published under this release's tag and read back anonymously;
  # the rows of the release lock travel on as the artifact board-rows.
  board-publish:
    needs: [plan, board]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - name: The release tag names HEAD
        run: git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
      - name: The public verity certificate, which the components carry and their inputs cover
        env:
          VERITY: ${{ vars.MICA_VERITY_TRUST_CERT }}
          BOOT: ${{ vars.MICA_BOOT_TRUST_CERT }}
        run: |
          set -euo pipefail
          mkdir -p meta/verity meta/boot
          printf '%s\n' "${VERITY}" | tr -d '\r' > meta/verity/signer.cert.pem
          printf '%s\n' "${BOOT}" | tr -d '\r' > meta/boot/signer.cert.pem
          grep -v '^#' trust-certificates.sha256 | sha256sum --strict -c -
      # merge-multiple puts every output tar flat in one directory, however many artifacts matched.
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.plan.outputs.board }}-{pool,kernel,uboot}-*
          path: ${{ github.workspace }}/_out/ci/outputs
          merge-multiple: true
      - name: The board's pool and built components of this run
        run: bash bin/bun.sh src/cli.ts ci-outputs unpack "${GITHUB_WORKSPACE}/_out/ci/outputs" ${{ needs.board.outputs.pool-names }} ${{ needs.board.outputs.built }}
      - name: Publish the board's pool and components
        env:
          MICA_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make board-publish
      - uses: actions/upload-artifact@v7
        with:
          name: board-rows
          path: _out/release/rows/
          if-no-files-found: error
          retention-days: 1

  product:
    needs: [plan, board, board-publish]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/release-product.yml
    with:
      product: ${{ matrix.product }}
      board: ${{ matrix.board }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      tag: ${{ github.event.release.tag_name }}
      generation: ${{ matrix.generation }}
      history: github
      upload: true
      built: ${{ needs.board.outputs.built }}
    secrets:
      MICA_RELEASE_VERITY_KEY: ${{ secrets.MICA_RELEASE_VERITY_KEY }}
      MICA_RELEASE_BOOT_KEY: ${{ secrets.MICA_RELEASE_BOOT_KEY }}
      MICA_RELEASE_UPDATES_KEY: ${{ secrets.MICA_RELEASE_UPDATES_KEY }}

  publish:
    needs: product
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: _out/release
      - uses: actions/download-artifact@v8
        with:
          name: board-rows
          path: _out/release/board-rows
      - name: The OCI bundles, read back anonymously, and mica-build.lock
        env:
          MICA_REGISTRY_USER: ${{ github.actor }}
          MICA_REGISTRY_TOKEN: ${{ github.token }}
        run: bash tools/release.sh publish "${TAG}" _out/release
      - name: The assets, then the lock and SHA256SUMS, attached to release ${{ github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh attach "${TAG}" _out/release

  # The Mica version index (tools/release.sh index): after a fully successful scoped release, mica.<YYYYMMDD-HHMM>
  # is the previous index with this release entering (the first index is built in full from every release), cut at
  # the tip of main with this workflow's token (a release it creates triggers no workflow), published as the latest
  # release and verified anonymously. One index job at a time, none cancelled; each reads the newest index when it
  # starts. ci.yml re-verifies the newest index in full on every push to main.
  index:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: mica-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: The Mica version index, verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh index "${TAG}"
