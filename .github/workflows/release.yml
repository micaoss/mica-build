# A scoped mica-build release (mica:docs/decisions/2026-09-15-mica-build-scoped-releases.md):
# the tag <scope>/<YYYYMMDD-HHMM> names a board (all its products) or one product; only
# those products are built, verified and published. Per product: the image files of its
# image kinds and the update packages of its update kinds as release assets
# mica-<product>-<YYYYMMDD-HHMM>.<suffix>, the OCI bundles image.<product>.<release> and
# update.<product>.<release> in ghcr.io/micaoss/mica-build, and one mica-build.lock
# (mica:docs/design/release-lock.md 1.2.2) with SHA256SUMS listing only it, uploaded last.
# tools/release.sh holds every step.
#
# CHANNEL. Every release targets the development channel: tools/product-build.sh
# --release assembles and gates its release directory with --channel
# development, and the release gate keeps refusing development-marked material
# on candidate and stable (user decision 2026-09-14).
#
# Triggered only by publishing a release (gh release create <scope>/<YYYYMMDD-HHMM>
# --target <commit of main>); it builds the tag the release names. Each product
# builds on the runner of its board's architecture; the publish job pushes the
# bundles, reads them back anonymously, writes the lock and attaches everything, so
# a release carries either all of its assets or a failed run.
#
# SIGNING. The release signs with the deployment's trust material, written to a
# private directory of the runner: the private keys are the repository secrets
# MICA_RELEASE_VERITY_KEY, MICA_RELEASE_BOOT_KEY and MICA_RELEASE_UPDATES_KEY,
# their public halves the repository variables MICA_VERITY_TRUST_CERT,
# MICA_BOOT_TRUST_CERT and MICA_UPDATES_PUBLIC_KEY (tools/product-build.sh's
# verity/, boot/ and updates/ files). The imported
# kernels must have been built against that verity certificate. The grade
# follows the certificates: MICA-development-* certificates write the
# development-grade marker the image reports; mixed grades are refused.
#
# CACHES. A release restores the archive and source caches that pushes to main
# saved, by exact key, and saves nothing; every restored file is hashed again
# by its reader, and a release builds the same without them.

name: release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MICA_BUILD_CONTAINER: "1"
  MICA_VERIFY_CONTAINER: "1"
  TAG: ${{ github.event.release.tag_name }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Every lock of locks/ is its release's
        run: make locks-verify
      - name: The products of the scope, their generations and previous releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _out/plan
          bash tools/release.sh plan "${TAG}" >_out/plan/plan.tsv
          cat _out/plan/plan.tsv
          while IFS=$'\t' read -r product board generation _; do
            arch="$(python3 tools/locks.py rows board | awk -F'\t' -v b="$board" '$2 == b && $3 == "board" { print $4 }')"
            case "$arch" in
              amd64) runner=ubuntu-24.04 ;;
              arm64) runner=ubuntu-24.04-arm ;;
              *) echo "error: no board row of locks/ names $board" >&2; exit 1 ;;
            esac
            jq -nc --arg p "$product" --arg b "$board" --arg a "$arch" --arg r "$runner" --arg g "$generation" '{product: $p, board: $b, arch: $a, runner: $r, generation: $g}'
          done <_out/plan/plan.tsv | jq -sc '{include: .}' | sed 's/^/matrix=/' >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: _out/plan/plan.tsv
          if-no-files-found: error
          retention-days: 1

  product:
    needs: plan
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      # The harness attaches its containers to the network named traefik.
      - name: The container network the harness attaches to
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      # The packaging tool images (boot/build-tools.sh, boot/Dockerfile.fit) are
      # linux/amd64 on every runner, so their packager identity is one image;
      # on the arm64 runner they run under emulation. The root itself is
      # composed and executed natively.
      - name: Emulation for the linux/amd64 packaging tools
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64
      - name: Restore the archives
        uses: actions/cache/restore@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
          key: pool-${{ matrix.arch }}-${{ hashFiles('locks/*.lock', 'locks/pins/*.pin') }}
      - name: The release trust material
        env:
          VERITY_KEY: ${{ secrets.MICA_RELEASE_VERITY_KEY }}
          VERITY_CERT: ${{ vars.MICA_VERITY_TRUST_CERT }}
          BOOT_KEY: ${{ secrets.MICA_RELEASE_BOOT_KEY }}
          BOOT_CERT: ${{ vars.MICA_BOOT_TRUST_CERT }}
          UPDATES_KEY: ${{ secrets.MICA_RELEASE_UPDATES_KEY }}
          UPDATES_PUBLIC: ${{ vars.MICA_UPDATES_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          signing="$RUNNER_TEMP/signing"
          mkdir -p "$signing/verity" "$signing/boot" "$signing/updates"
          for pair in VERITY_KEY:verity/signer.key.pem VERITY_CERT:verity/signer.cert.pem BOOT_KEY:boot/signer.key.pem \
              BOOT_CERT:boot/signer.cert.pem UPDATES_KEY:updates/signer.key.pem UPDATES_PUBLIC:updates/public.key; do
            name="${pair%%:*}"
            [ -n "${!name}" ] || { echo "error: the release secret or variable for ${pair#*:} is not set" >&2; exit 1; }
            printf '%s\n' "${!name}" >"$signing/${pair#*:}"
          done
          grades=""
          for cert in verity boot; do
            case "$(docker run --rm --label ai-agent=true --network none -v "$signing/$cert/signer.cert.pem:/cert.pem:ro" "$(bash tools/from.sh --ref mica-build-env:base)" \
                openssl x509 -in /cert.pem -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= *//p')" in
              MICA-development-*) grades="$grades development" ;;
              *) grades="$grades production" ;;
            esac
          done
          case "$grades" in
            " development development") printf 'DEVELOPMENT-GRADE\nDOMAINS=boot verity updates\n' >"$signing/GENERATED" ;;
            " production production") ;;
            *) echo "error: the verity and boot certificates are of different grades:$grades" >&2; exit 1 ;;
          esac
          echo "MICA_SIGNING_OUTPUT=$signing" >>"$GITHUB_ENV"
          echo "MICA_VERITY_TRUST_CERT=$signing/verity/signer.cert.pem" >>"$GITHUB_ENV"
      - name: The board is a release target
        run: |
          set -euo pipefail
          # Every pinned board: the verifier models all of them (verify/src/paths.ts).
          bash tools/board-pool.sh --fetch-all
          grep -qx 'BOARD_RELEASE_TARGET=1' "_out/boards/${{ matrix.board }}/board.env" ||
            { echo "error: board ${{ matrix.board }} is not a release target; a release of ${{ matrix.product }} is refused" >&2; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: _out/plan
      - name: Build ${{ matrix.product }} as release ${{ github.event.release.tag_name }}, generation ${{ matrix.generation }}
        run: bash tools/product-build.sh "${{ matrix.product }}" --release "${TAG#*/}" --generation "${{ matrix.generation }}"
      - name: Verify its image against the contract
        run: bash tools/product-build.sh "${{ matrix.product }}" --verify
      - name: Its release files and rows
        run: bash tools/release.sh collect "${{ matrix.product }}" "${TAG}" _out/plan/plan.tsv _out/release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.product }}
          path: _out/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: product
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: _out/release
      - name: The OCI bundles, read back anonymously, and mica-build.lock
        env:
          MICA_REGISTRY_USER: ${{ github.actor }}
          MICA_REGISTRY_TOKEN: ${{ github.token }}
        run: bash tools/release.sh publish "${TAG}" _out/release
      - name: The assets, then the lock and SHA256SUMS, attached to release ${{ github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh attach "${TAG}" _out/release
