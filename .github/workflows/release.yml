# A mica-build release: every release-target product built from the release's
# tag, verified, and attached to that release as GitHub Release assets --
# mica-<product>-<release>.img, .micaupd, -components.tar and -release.tar, with SHA256SUMS.
#
# CHANNEL. Every release targets the development channel: tools/product-build.sh
# --release assembles and gates its release directory with --channel
# development, and the release gate keeps refusing development-marked material
# on candidate and stable (user decision 2026-09-14).
#
# Triggered only by publishing a release (gh release create <YYYYMMDD-HHMM>
# --target <commit of main>); it builds the tag the release names. Each product
# builds on the runner of its board's architecture, and one final job writes
# SHA256SUMS over every asset and uploads them, so a release carries either
# all of its assets or a failed run.
#
# SIGNING. The release signs with the deployment's trust material, written to a
# private directory of the runner: the private keys are the repository secrets
# MICA_RELEASE_VERITY_KEY, MICA_RELEASE_BOOT_KEY and MICA_RELEASE_UPDATES_KEY,
# their public halves the repository variables MICA_VERITY_TRUST_CERT,
# MICA_BOOT_TRUST_CERT and MICA_UPDATES_PUBLIC_KEY (tools/product-build.sh's
# verity/, boot/ and updates/ files). The imported
# kernels must have been built against that verity certificate. Releases use
# the existing development certificates for now (user decision 2026-09-14), so
# the grade follows the certificates: MOS-development-* certificates write the
# development-grade marker the image reports; mixed grades are refused.
#
# CACHES. A release restores the archive and source caches that pushes to main
# saved, by exact key, and saves nothing; every restored file is hashed again
# by its reader, and a release builds the same without them.

name: release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MICA_BUILD_CONTAINER: "1"
  MICA_VERIFY_CONTAINER: "1"
  TAG: ${{ github.event.release.tag_name }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: The release name is a UTC release
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^[0-9]{8}-[0-9]{4}$ ]] || { echo "error: release ${TAG} is not named YYYYMMDD-HHMM" >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: The build env and Base locks are their releases'
        run: |
          set -euo pipefail
          make build-env-verify
          make system-base-verify
      - name: Every product and the runner of its architecture
        id: plan
        run: |
          set -euo pipefail
          for p in $(bash tools/product.sh --list); do
            board="$(sed -n 's/^BOARD=//p' "products/$p/product.env" | tr -d '"')"
            arch="$(jq -r '.targets | keys | if length == 1 then .[0] else error("one architecture per kernel pin") end' "deps/packages/mica-kernel-$board.json")"
            case "$arch" in
              amd64) runner=ubuntu-24.04 ;;
              arm64) runner=ubuntu-24.04-arm ;;
            esac
            jq -nc --arg p "$p" --arg b "$board" --arg a "$arch" --arg r "$runner" '{product: $p, board: $b, arch: $a, runner: $r}'
          done | jq -sc '{include: .}' | sed 's/^/matrix=/' >>"$GITHUB_OUTPUT"

  product:
    needs: plan
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      # The harness attaches its containers to the network named traefik.
      - name: The container network the harness attaches to
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      # The packaging tool images (boot/build-tools.sh, boot/Dockerfile.fit) are
      # linux/amd64 on every runner, so their packager identity is one image;
      # on the arm64 runner they run under emulation. The root itself is
      # composed and executed natively.
      - name: Emulation for the linux/amd64 packaging tools
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64
      - name: Restore the archives
        uses: actions/cache/restore@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
          key: pool-${{ matrix.arch }}-${{ hashFiles('deps/packages/*.json', 'deps/releases/*.json', 'system-base.lock', 'system-base-packages.lock') }}
      - name: The release trust material
        env:
          VERITY_KEY: ${{ secrets.MICA_RELEASE_VERITY_KEY }}
          VERITY_CERT: ${{ vars.MICA_VERITY_TRUST_CERT }}
          BOOT_KEY: ${{ secrets.MICA_RELEASE_BOOT_KEY }}
          BOOT_CERT: ${{ vars.MICA_BOOT_TRUST_CERT }}
          UPDATES_KEY: ${{ secrets.MICA_RELEASE_UPDATES_KEY }}
          UPDATES_PUBLIC: ${{ vars.MICA_UPDATES_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          signing="$RUNNER_TEMP/signing"
          mkdir -p "$signing/verity" "$signing/boot" "$signing/updates"
          for pair in VERITY_KEY:verity/signer.key.pem VERITY_CERT:verity/signer.cert.pem BOOT_KEY:boot/signer.key.pem \
              BOOT_CERT:boot/signer.cert.pem UPDATES_KEY:updates/signer.key.pem UPDATES_PUBLIC:updates/public.key; do
            name="${pair%%:*}"
            [ -n "${!name}" ] || { echo "error: the release secret or variable for ${pair#*:} is not set" >&2; exit 1; }
            printf '%s\n' "${!name}" >"$signing/${pair#*:}"
          done
          grades=""
          for cert in verity boot; do
            case "$(docker run --rm --label ai-agent=true --network none -v "$signing/$cert/signer.cert.pem:/cert.pem:ro" "$(bash tools/from.sh --ref IMAGE_MICA_BUILD_BASE)" \
                openssl x509 -in /cert.pem -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= *//p')" in
              MOS-development-*) grades="$grades development" ;;
              *) grades="$grades production" ;;
            esac
          done
          case "$grades" in
            " development development") printf 'DEVELOPMENT-GRADE\nDOMAINS=boot verity updates\n' >"$signing/GENERATED" ;;
            " production production") ;;
            *) echo "error: the verity and boot certificates are of different grades:$grades" >&2; exit 1 ;;
          esac
          echo "MICA_SIGNING_OUTPUT=$signing" >>"$GITHUB_ENV"
          echo "MICA_VERITY_TRUST_CERT=$signing/verity/signer.cert.pem" >>"$GITHUB_ENV"
      - name: Is the board a release target
        id: target
        run: |
          set -euo pipefail
          bash tools/pool.sh fetch --arch ${{ matrix.arch }} --packages mica-kernel-${{ matrix.board }}
          bash tools/board-pool.sh --fetch ${{ matrix.board }}
          if grep -qx 'BOARD_RELEASE_TARGET=1' "_out/boards/${{ matrix.board }}/board.env"; then
            echo "build=1" >>"$GITHUB_OUTPUT"
          else
            echo "${{ matrix.product }}: board ${{ matrix.board }} is not a release target; nothing is built"
            echo "build=0" >>"$GITHUB_OUTPUT"
          fi
      - name: Build ${{ matrix.product }} as release ${{ github.event.release.tag_name }}
        if: steps.target.outputs.build == '1'
        run: bash tools/product-build.sh "${{ matrix.product }}" --release "${TAG}"
      - name: Verify its image against the contract
        if: steps.target.outputs.build == '1'
        run: bash tools/product-build.sh "${{ matrix.product }}" --verify
      - name: Its release assets
        if: steps.target.outputs.build == '1'
        run: bash tools/release-assets.sh collect "${{ matrix.product }}" "${TAG}" _out/release
      - uses: actions/upload-artifact@v7
        if: steps.target.outputs.build == '1'
        with:
          name: assets-${{ matrix.product }}
          path: _out/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: product
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          merge-multiple: true
          path: _out/release
      - name: SHA256SUMS over every asset, and the upload to release ${{ github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/release-assets.sh sums _out/release
          gh release upload "${TAG}" _out/release/mica-* _out/release/SHA256SUMS --repo "${{ github.repository }}"
