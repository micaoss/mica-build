# A scoped mica-build release (mica:docs/decisions/2026-09-15-mica-build-scoped-releases.md):
# the tag <scope>.<YYYYMMDD-HHMM> names a board (all its products) or one product; only
# those products are built, verified and published. Per product: the image files of its
# image kinds and the update packages of its update kinds as release assets
# mica-<product>-<YYYYMMDD-HHMM>.<suffix>, the OCI bundles image.<product>.<release> and
# update.<product>.<release> in ghcr.io/micaoss/mica-build, and one mica-build.lock
# (mica:docs/design/release-lock.md 1.2.2) with SHA256SUMS listing only it, uploaded last.
# tools/release.sh holds every step.
#
# CHANNEL. Every release targets the development channel: tools/product-build.sh
# --release assembles and gates its release directory with --channel
# development, and the release gate keeps refusing development-marked material
# on candidate and stable (user decision 2026-09-14).
#
# Triggered only by publishing a release (gh release create <scope>.<YYYYMMDD-HHMM>
# --target <commit of main>); it builds the tag the release names. Each product
# builds on the runner of its board's architecture; the publish job pushes the
# bundles, reads them back anonymously, writes the lock and attaches everything, so
# a release carries either all of its assets or a failed run.
#
# SIGNING. The release signs with the deployment's trust material, written to a
# private directory of the runner: the private keys are the repository secrets
# MICA_RELEASE_VERITY_KEY, MICA_RELEASE_BOOT_KEY and MICA_RELEASE_UPDATES_KEY,
# their public halves the repository variables MICA_VERITY_TRUST_CERT,
# MICA_BOOT_TRUST_CERT and MICA_UPDATES_PUBLIC_KEY (tools/product-build.sh's
# verity/, boot/ and updates/ files). The imported
# kernels must have been built against that verity certificate. The grade
# follows the certificates: MICA-development-* certificates write the
# development-grade marker the image reports; mixed grades are refused.
#
# CACHES. A release restores the archive and source caches that pushes to main
# saved, by exact key, and saves nothing; every restored file is hashed again
# by its reader, and a release builds the same without them.

name: release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MICA_BUILD_CONTAINER: "1"
  MICA_VERIFY_CONTAINER: "1"
  TAG: ${{ github.event.release.tag_name }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      # tools/release.sh plan refuses the scope mica: a Mica version index is cut by the index job below.
      - name: Every lock of locks/ is its release's
        run: make locks-verify
      # MICA_RELEASE_GENERATIONS is the repository variable that raises a planned generation for a product whose
      # published history this tree can no longer read; tools/release.sh refuses a floor below the planned
      # generation, so a stale one fails the release rather than lowering it. Unset it once its cut is done.
      - name: The products of the scope, their generations and previous releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MICA_RELEASE_GENERATIONS: ${{ vars.MICA_RELEASE_GENERATIONS }}
        run: |
          set -euo pipefail
          mkdir -p _out/plan
          bash tools/release.sh plan "${TAG}" >_out/plan/plan.tsv
          cat _out/plan/plan.tsv
          while IFS=$'\t' read -r product board generation _; do
            arch="$(python3 tools/locks.py rows board | awk -F'\t' -v b="$board" '$2 == b && $3 == "board" { print $4 }')"
            case "$arch" in
              amd64) runner=ubuntu-24.04 ;;
              arm64) runner=ubuntu-24.04-arm ;;
              *) echo "error: no board row of locks/ names $board" >&2; exit 1 ;;
            esac
            jq -nc --arg p "$product" --arg b "$board" --arg a "$arch" --arg r "$runner" --arg g "$generation" '{product: $p, board: $b, arch: $a, runner: $r, generation: $g}'
          done <_out/plan/plan.tsv | jq -sc '{include: .}' | sed 's/^/matrix=/' >>"$GITHUB_OUTPUT"

  product:
    needs: plan
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/release-product.yml
    with:
      product: ${{ matrix.product }}
      board: ${{ matrix.board }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      tag: ${{ github.event.release.tag_name }}
      history: github
      upload: true
    secrets:
      MICA_RELEASE_VERITY_KEY: ${{ secrets.MICA_RELEASE_VERITY_KEY }}
      MICA_RELEASE_BOOT_KEY: ${{ secrets.MICA_RELEASE_BOOT_KEY }}
      MICA_RELEASE_UPDATES_KEY: ${{ secrets.MICA_RELEASE_UPDATES_KEY }}

  publish:
    needs: product
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: _out/release
      - name: The OCI bundles, read back anonymously, and mica-build.lock
        env:
          MICA_REGISTRY_USER: ${{ github.actor }}
          MICA_REGISTRY_TOKEN: ${{ github.token }}
        run: bash tools/release.sh publish "${TAG}" _out/release
      - name: The assets, then the lock and SHA256SUMS, attached to release ${{ github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh attach "${TAG}" _out/release

  # The Mica version index (tools/release.sh index): after a fully successful scoped release, mica.<YYYYMMDD-HHMM>
  # is the previous index with this release entering (the first index is built in full from every release), cut at
  # the tip of main with this workflow's token (a release it creates triggers no workflow), published as the latest
  # release and verified anonymously. One index job at a time, none cancelled; each reads the newest index when it
  # starts. ci.yml re-verifies the newest index in full on every push to main.
  index:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: mica-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: The Mica version index, verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release.sh index "${TAG}"
