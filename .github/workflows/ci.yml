# The quality gates, on every push to main and every pull request. This
# workflow publishes nothing.
#
# It runs the `make` targets rather than restating what they do: there is one
# definition of "checked", in the tree, and this file only decides where and
# when it runs.
#
# THE BOARDS ARE BUILT HERE TOO (build-boards.yml): every board's kernel and
# U-Boot whose inputs hash differs from the latest release's, natively on the
# board's architecture, and every board's packages with their gates; a
# component the latest release published with the same inputs is reused by
# digest, so a push that touches the engine builds no kernel. The jobs that
# read the board bundles take the built components out of this run's
# artifacts and the reused ones out of the registry (tools/board-pool.sh).
#
# ONE JOB PER ARCHITECTURE, NATIVELY. What depends on the architecture -- the
# imported pool and a product's composition and smoke -- runs on ubuntu-24.04
# for amd64 and on ubuntu-24.04-arm for arm64. Nothing here uses QEMU: the
# boot-tools image is linux/amd64 for both EFI targets by design (the aa64
# target is a cross build of the same tools), so it needs no emulation either.
#
# CACHES ONLY SPEED A RUN. Each key is derived from the inputs that determine
# the cached content (the locks and pins of locks/, the bun lockfiles with the
# build-env lock), and nothing cached skips a check: tools/pool.sh and
# tools/base-packages.sh hash every cached archive again, tools/oci.sh every
# manifest, tools/source.sh refuses a checkout that is not its release commit, and a node_modules directory is taken
# only under the exact key of its lockfile. Caches are restored by exact key and
# saved only by pushes to main, after tools/cache-prune.sh removed everything
# the current pins do not name; a pull request restores and never saves.
#
# Not here: the image pipeline, repart and the factory-root gates need a
# privileged, long-running runner (privileged.yml); the UEFI lifecycle and the
# apid API suite boot an image under QEMU/KVM; the install-closure gate is not
# wired.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# bun runs only as mica-build-env:base, even on a runner that has its own.
env:
  MICA_BUILD_CONTAINER: "1"
  MICA_VERIFY_CONTAINER: "1"

jobs:
  # bash, awk, git, curl and jq: no image, no build.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Every lock of locks/ is the lock of the release its pin names, and every image selector is a digest pin
        run: make locks-verify
      - name: The release-lock vectors are mica's, at the commit vectors.pin names
        run: make os-vectors-pin-check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: No early-exiting reader on the right of a pipe
        run: make os-shell-pipefail-lint
      - name: No compiler or assembler runs on the host
        run: make os-host-toolchain-lint
      - name: ...and that check can still go red
        run: make os-host-toolchain-lint-test
      - name: No board name in the engine
        run: make os-board-name-lint
      - name: ...and that lint can still go red
        run: make os-board-name-lint-test
      - name: Every package row is a layer of its pool manifest, at its pinned digest
        run: make os-pool-check

  # The boards' own gates: shell lint, the board contract, the kernel-config
  # floor, the fixtures and every board's tests.
  boards-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The container network the harness attaches to
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      - name: Lint, the board contract, the kernel-config floor and the boards' tests
        run: make board-check

  # Every board: kernels and U-Boots built or reused, pools and package gates.
  boards-build:
    needs: boards-check
    uses: ./.github/workflows/build-boards.yml
    with:
      ref: ${{ github.sha }}

  # The TypeScript suites, the pool and boot tooling suites and the offline
  # runtime suites, in the pinned images on the x64 runner.
  suites:
    needs: boards-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The harness attaches its containers to the network named traefik.
      - name: The container network the harness attaches to
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      - name: Restore the bun dependencies
        id: bun-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: bun-${{ runner.arch }}-${{ hashFiles('locks/mica-build-env.lock', 'bun.lock', 'package.json') }}
      - name: Restore the imported sources
        id: src-cache
        uses: actions/cache/restore@v6
        with:
          path: _out/src
          key: src-${{ hashFiles('locks/*.lock', 'locks/pins/*.pin') }}
      - name: Restore the amd64 archives
        id: pool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
          key: pool-amd64-${{ hashFiles('locks/*.lock', 'locks/pins/*.pin') }}
      # The suites read the boards out of _out/boards: the built components of
      # this run, the reused ones by digest; a reused kernel is refused unless
      # it embeds the certificate of the repository variable MICA_VERITY_TRUST_CERT.
      - uses: actions/download-artifact@v8
        if: needs.boards-build.outputs.built != ''
        with:
          pattern: all-{kernel,uboot}-*
          path: ${{ runner.temp }}/outputs
          merge-multiple: true
      - name: Every board's bundle
        env:
          CERT: ${{ vars.MICA_VERITY_TRUST_CERT }}
          BUILT: ${{ needs.boards-build.outputs.built }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$CERT" ] || { echo "error: the repository variable MICA_VERITY_TRUST_CERT is not set" >&2; exit 1; }
          printf '%s\n' "$CERT" >"$RUNNER_TEMP/verity-trust.cert.pem"
          # shellcheck disable=SC2086
          [ -z "${BUILT}" ] || bash tools/ci-outputs.sh unpack "${RUNNER_TEMP}/outputs" ${BUILT}
          MICA_VERITY_TRUST_CERT="$RUNNER_TEMP/verity-trust.cert.pem" make board-fetch-all
      - name: The build suite
        run: make os-build-test
      # The verify suite reads the engine's pins out of the pinned mica-podman archives.
      - name: The mica-podman upstream.lock, the same in the archives of both architectures
        run: |
          set -euo pipefail
          bash tools/pool.sh fetch --arch amd64 --packages mica-podman
          bash tools/pool.sh fetch --arch arm64 --packages mica-podman
          bash tools/podman-pool.sh --check
      - name: The verify suite
        run: make os-verify-test
      - name: tools/pool.sh against fixture locks
        run: make os-pool-test
      - name: tools/release.sh over fixture releases and a local registry
        run: make os-release-test
      - name: The offline chain over a fixture workspace
        run: make os-offline-chain-test
      - name: The board bundle rules and the profile kernel directory
        run: make os-board-bundle-test
      - name: The image kind executor over a fake board packer
        run: make os-image-kinds-test
      - name: The component contract matches mica-core at its release commit
        run: bash tools/deploy-pool.sh --check
      # The fixture roots carry device nodes and foreign owners, which only root
      # can create; the pool is fetched as the runner user, the tests run under sudo.
      - name: Runtime closure and metadata preservation on small offline roots
        run: |
          set -euo pipefail
          bash tools/pool.sh fetch --arch amd64
          sudo bash tests/gates/rootfs-runtime-test.sh
      - name: The boot tooling
        run: make os-boot-test
      - name: The aa64 boot tools build with the Base loader
        run: make os-boot-tools MICA_BOOT_TARGET=aa64
      - name: The apid phase pins agree with the OpenAPI document the pinned mica-apid ships
        run: make os-apid-api-spec-pins
      - name: The package lints and typechecks, in the pinned bun image
        # The whole package at once: the engine, the verifier and the suites'
        # drivers, including the apid phase files that only the nine-minute QEMU
        # suite executes -- without this a type error in a phase reaches CI
        # through a boot. bin/bun.sh takes the container route on a runner
        # with no bun; the dependencies come out of the cache restored above.
        run: |
          set -euo pipefail
          bash bin/bun.sh run lint
          bash bin/bun.sh run typecheck
      - name: Save the bun dependencies
        if: github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - name: Save the imported sources
        if: github.event_name == 'push' && steps.src-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: _out/src
          key: ${{ steps.src-cache.outputs.cache-primary-key }}
      - name: Prune the archive caches to this commit's pins
        if: github.event_name == 'push' && steps.pool-cache.outputs.cache-hit != 'true'
        run: bash tools/cache-prune.sh
      - name: Save the amd64 archives
        if: github.event_name == 'push' && steps.pool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
          key: ${{ steps.pool-cache.outputs.cache-primary-key }}

  # The whole pool of each architecture, fetched, verified and indexed on its
  # own runner, and the board bundles read out of it; then what reads them.
  pool:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The harness attaches its containers to the network named traefik.
      - name: The container network the harness attaches to
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      - name: Restore the ${{ matrix.arch }} archives
        id: pool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
          key: pool-${{ matrix.arch }}-${{ hashFiles('locks/*.lock', 'locks/pins/*.pin') }}
      - name: The ${{ matrix.arch }} pool at its pins
        run: |
          set -euo pipefail
          bash tools/pool.sh fetch --arch ${{ matrix.arch }}
          bash tools/pool.sh index --arch ${{ matrix.arch }}
      - name: The ${{ matrix.arch }} Debian packages Base pins for later stages
        run: bash tools/base-packages.sh fetch --arch ${{ matrix.arch }}
      - name: Prune the archive caches to this commit's pins
        if: github.event_name == 'push' && steps.pool-cache.outputs.cache-hit != 'true'
        run: bash tools/cache-prune.sh
      - name: Save the ${{ matrix.arch }} archives
        if: github.event_name == 'push' && steps.pool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
          key: ${{ steps.pool-cache.outputs.cache-primary-key }}

  # The board bundles and everything that reads them: this run's built
  # components and the reused ones by digest (tools/board-pool.sh --fetch).
  boards:
    needs: boards-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The harness attaches its containers to the network named traefik.
      - name: The container network the harness attaches to
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      - name: Restore the archives
        id: pool-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
            _out/cache/boards
          key: pool-boards-${{ hashFiles('locks/*.lock', 'locks/pins/*.pin') }}
      # The board bundles are refused unless their kernels embed this certificate;
      # it is public and comes from the repository variable MICA_VERITY_TRUST_CERT.
      - name: The verity certificate the board kernels embed
        env:
          CERT: ${{ vars.MICA_VERITY_TRUST_CERT }}
        run: |
          set -euo pipefail
          [ -n "$CERT" ] || { echo "error: the repository variable MICA_VERITY_TRUST_CERT is not set" >&2; exit 1; }
          printf '%s\n' "$CERT" >"$RUNNER_TEMP/verity-trust.cert.pem"
          echo "MICA_VERITY_TRUST_CERT=$RUNNER_TEMP/verity-trust.cert.pem" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        if: needs.boards-build.outputs.built != ''
        with:
          pattern: all-{kernel,uboot}-*
          path: ${{ runner.temp }}/outputs
          merge-multiple: true
      - name: Every board's bundle
        env:
          BUILT: ${{ needs.boards-build.outputs.built }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/pool.sh fetch --arch amd64
          bash tools/pool.sh fetch --arch arm64
          # shellcheck disable=SC2086
          [ -z "${BUILT}" ] || bash tools/ci-outputs.sh unpack "${RUNNER_TEMP}/outputs" ${BUILT}
          make board-fetch-all
      - name: Every product validates against its board; the product contract's refusals fire
        run: make os-product-test
      - name: The package-set resolver over every board
        run: make os-rootfs-manifest-test
      - name: Every board's layout against the schema
        run: make os-layout-lint
      - name: The imported kernels carry what netavark needs
        run: make os-netavark-kernel-test
      - name: Firmware record parsing and persistent attempt IO
        run: make os-fit-records-test
      - name: Prune the archive caches to this commit's pins
        if: github.event_name == 'push' && steps.pool-cache.outputs.cache-hit != 'true'
        run: bash tools/cache-prune.sh
      - name: Save the archives
        if: github.event_name == 'push' && steps.pool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
            _out/cache/boards
          key: ${{ steps.pool-cache.outputs.cache-primary-key }}

  # ONE JOB PER PRODUCT, on the runner of its board's architecture: the
  # product's root composed on the Base root and its smoke executed natively.
  # Signing and image assembly stay in privileged.yml.
  # The release product path, exactly as release.yml runs it (.github/workflows/release-product.yml),
  # from a clean hosted checkout: the prod product of every release-target board, planned under a
  # fixture tag with no earlier release, built, verified and collected. Nothing is published. Pushes
  # to main only, since it signs with the release trust material a pull request cannot read.
  # The Mica version index job's path against the real release history: the lock and mica-index.json of an index
  # of the newest scoped releases, every cross-release check, nothing uploaded.
  # The newest Mica version index, re-verified in full against every release it references, at its own commit and
  # publishing nothing; before the first index exists, the first index built as a dry run at this commit.
  release-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: The newest index and its commit
        id: newest
        # Inline rather than tools/release.sh, because the checkout below is AT THE INDEX'S OWN COMMIT and
        # therefore cannot happen until the tag is known: at this point the tree is not checked out at all.
        # THE SLASH FORM IS EXCLUDED ON PURPOSE. A tag of the retired <scope>/<stamp> form is no release tag
        # here (tools/release.sh newest_index says the same in the same words), so the first index in the dot
        # form is built in full rather than carried from a predecessor this tree can no longer read. Stated
        # because a filter that encodes one naming convention drops everything under the other in silence,
        # and silence reads exactly like absence: the same query without this sentence counted nine of the
        # ten published indexes and nobody could see which one was missing.
        run: |
          set -euo pipefail
          tag="$(git ls-remote --tags https://github.com/micaoss/mica-build 'refs/tags/mica.*' | cut -f2 | sed 's|^refs/tags/||' | { grep -E '^mica\.[0-9]{8}-[0-9]{4}$' || true; } | sort | tail -1)"
          commit="${GITHUB_SHA}"
          if [ -n "$tag" ]; then
            commit="$(curl -fsSL "https://github.com/micaoss/mica-build/releases/download/${tag}/mica-build.lock" | awk -F'\t' '$1 == "release" { print $4 }')"
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.newest.outputs.commit }}
      - name: tools/release.sh verify-index --full, or index --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.newest.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            bash tools/release.sh verify-index "$TAG" --full
          else
            bash tools/release.sh index --dry-run
          fi
  release-products-plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: The prod product of every release-target board
        id: plan
        run: |
          set -euo pipefail
          for p in $(bash tools/product.sh --list | grep -- '-prod$'); do
            board="$(sed -n 's/^BOARD=//p' "products/$p/product.env" | tr -d '"')"
            arch="$(bash tools/boards.sh arch "$board")"
            case "$arch" in
              amd64) runner=ubuntu-24.04 ;;
              arm64) runner=ubuntu-24.04-arm ;;
              *) echo "error: boards/boards.tsv names no architecture of $board" >&2; exit 1 ;;
            esac
            grep -qx 'BOARD_RELEASE_TARGET=1' "boards/$board/board.env" || continue
            jq -nc --arg p "$p" --arg b "$board" --arg a "$arch" --arg r "$runner" '{product: $p, board: $b, arch: $a, runner: $r}'
          done | jq -sc '{include: .}' | sed 's/^/matrix=/' >>"$GITHUB_OUTPUT"
  release-products:
    needs: [release-products-plan, boards-build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-products-plan.outputs.matrix) }}
    uses: ./.github/workflows/release-product.yml
    with:
      product: ${{ matrix.product }}
      board: ${{ matrix.board }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      tag: ${{ matrix.product }}.20000101-0000
      history: none
      upload: false
      built: ${{ needs.boards-build.outputs.built }}
    secrets:
      MICA_RELEASE_VERITY_KEY: ${{ secrets.MICA_RELEASE_VERITY_KEY }}
      MICA_RELEASE_BOOT_KEY: ${{ secrets.MICA_RELEASE_BOOT_KEY }}
      MICA_RELEASE_UPDATES_KEY: ${{ secrets.MICA_RELEASE_UPDATES_KEY }}
  products-plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Every product and the runner of its architecture
        id: plan
        run: |
          set -euo pipefail
          for p in $(bash tools/product.sh --list); do
            board="$(sed -n 's/^BOARD=//p' "products/$p/product.env" | tr -d '"')"
            arch="$(bash tools/boards.sh arch "$board")"
            case "$arch" in
              amd64) runner=ubuntu-24.04 ;;
              arm64) runner=ubuntu-24.04-arm ;;
            esac
            jq -nc --arg p "$p" --arg a "$arch" --arg r "$runner" '{product: $p, arch: $a, runner: $r}'
          done | jq -sc '{include: .}' | sed 's/^/matrix=/' >>"$GITHUB_OUTPUT"
  products:
    needs: [products-plan, boards-build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.products-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The pack stage exports the factory root as an OCI archive, which the
      # docker driver can do only over the containerd image store; the hosted
      # runners ship the classic store.
      - name: The containerd image store
        run: |
          set -euo pipefail
          config=/etc/docker/daemon.json
          { sudo cat "$config" 2>/dev/null || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' >"$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" "$config"
          sudo systemctl restart docker
          [ "$(docker info -f '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}')" = io.containerd.snapshotter.v1 ] ||
            { echo "error: docker did not come back on the containerd image store" >&2; docker info >&2; exit 1; }
      # The harness attaches its containers to the network named traefik.
      - name: The container network the harness attaches to
        run: docker network inspect traefik >/dev/null 2>&1 || docker network create --label ai-agent=true traefik
      - name: Restore the ${{ matrix.arch }} archives
        uses: actions/cache/restore@v6
        with:
          path: |
            _out/cache/pool
            _out/cache/debian
          key: pool-${{ matrix.arch }}-${{ hashFiles('locks/*.lock', 'locks/pins/*.pin') }}
      # The board bundles are refused unless their kernels embed this certificate;
      # it is public and comes from the repository variable MICA_VERITY_TRUST_CERT.
      - name: The verity certificate the board kernels embed
        env:
          CERT: ${{ vars.MICA_VERITY_TRUST_CERT }}
        run: |
          set -euo pipefail
          [ -n "$CERT" ] || { echo "error: the repository variable MICA_VERITY_TRUST_CERT is not set" >&2; exit 1; }
          printf '%s\n' "$CERT" >"$RUNNER_TEMP/verity-trust.cert.pem"
          echo "MICA_VERITY_TRUST_CERT=$RUNNER_TEMP/verity-trust.cert.pem" >>"$GITHUB_ENV"
      # The boards' own packages of this architecture (the pool artifact of build-boards.yml) and the
      # board's built components, out of this run; the reused components by digest.
      - uses: actions/download-artifact@v8
        with:
          pattern: all-{pool-${{ matrix.arch }},kernel-*,uboot-*}
          path: ${{ runner.temp }}/outputs
          merge-multiple: true
      - name: The ${{ matrix.arch }} pool, the boards' packages in it, and the board bundle
        env:
          BUILT: ${{ needs.boards-build.outputs.built }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          board="$(sed -n 's/^BOARD=//p' "products/${{ matrix.product }}/product.env" | tr -d '"')"
          # shellcheck disable=SC2086
          bash tools/ci-outputs.sh unpack "${RUNNER_TEMP}/outputs" pool-${{ matrix.arch }} ${BUILT}
          bash tools/pool.sh fetch --arch ${{ matrix.arch }}
          bash tools/pool.sh index --arch ${{ matrix.arch }}
          bash tools/board-pool.sh --fetch "$board"
      - name: Compose the product's root on the Base root and execute its smoke
        run: make os-rootfs PRODUCT="${{ matrix.product }}"
