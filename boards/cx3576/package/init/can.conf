# CAN defaults for cx3576 (rk3576_canfd). CAN0 has no external connector and is
# disabled in the dts, so the routed controller (CAN1) is the only registered
# netdev and Linux names it can0.
# Values below are the hardware-verified ones from the board bring-up rootfs:
# classic CAN at 250 kbit/s, CAN FD deliberately off.
# Override on device by editing this file.
interface=can0
bitrate=250000
restart-ms=100
fd=off
