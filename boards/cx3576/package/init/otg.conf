# USB OTG (drd0) role for cx3576.
# node: sysfs role selector of the usb2-phy OTG port
# mode: default role; override per device by writing a role to /etc/mica/otg-mode
# "otg" lets the PHY pick the role from the cable: with nothing attached the
# port acts as a host, and attaching a host PC switches it to peripheral, which
# is what brings up the CDC ACM debug console (see gadget.conf).
node=/sys/devices/platform/2602e000.syscon/2602e000.syscon:usb2-phy@0/otg_mode
mode=otg
