# The gadget port's poison state is "enumerated but unread": CDC ACM asserts
# carrier as soon as the HOST CONFIGURES the device, before any host program
# opens the port -- so stock agetty proceeds, and its prompt write blocks
# forever in a TX buffer nobody drains, WHILE HOLDING the utmp flock that
# PID 1 also takes. Measured on hardware: agetty(ttyGS0) in wait_woken held
# the lock, PID 1 sat in locks_lock_inode_wait, and every systemctl hung.
# --wait-cr writes NOTHING until the peer sends a carriage return; a human
# who can press Enter proves a drained read path, so the blocking-write
# window cannot open. (The bring-up rootfs survived the same topology only
# because busybox getty takes no utmp flock.)
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --wait-cr --keep-baud 115200,57600,38400,9600 %I $TERM
