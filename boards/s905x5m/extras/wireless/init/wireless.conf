# Seekwave Wi-Fi/Bluetooth combo module on the board's SDIO bus.
power-control=/sys/class/aml_wifi/power
platform-module=amlogic-wireless
transport-modules=skw_sdio
wifi-module=skw
# This driver creates both wlan0 and p2p0; its station role is p2p0.
interface=p2p0
bt-transport=/dev/BTDATA
vhci=/dev/vhci
wait-seconds=15
