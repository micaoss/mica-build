# Seekwave HCI transport. The controller otherwise uses the same firmware
# default address on every board, so the bridge requires a stable derived one.
bridge=/usr/sbin/skw_vhci_bridge
library=/usr/lib/bluetooth/plugins/libskwbt.so
address-file=/var/lib/bluetooth/bdaddr
address-seed=/sys/class/net/eth0/address
bt-transport=/dev/BTDATA
vhci=/dev/vhci
wait-seconds=15
