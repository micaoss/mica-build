;
; Manual installation of the complete Mica eMMC system.
; The package replaces GPT, both loader destinations and firmware/system/data.
; Preserve unrelated raw regions by leaving whole-flash erase disabled.
; Windows USB Burning Tool has its own erase settings: this file is used by
; the vendor SD-burning transport and does not override Windows selections.
;
[common]
erase_bootloader    = 1
erase_flash         = 0
reboot              = 0

[burn_ex]
package             = update.img
