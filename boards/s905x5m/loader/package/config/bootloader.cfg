; This package deliberately omits both gpt.bin and bootloader_a. The special
; bootloader destination is responsible for framing the target hardware boot
; areas with storage_emmc_boot_info. bootloader_a is a user-area GPT partition;
; without a packaged GPT, the burning flow cannot locate and verify it safely.
