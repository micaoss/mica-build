;
; Amlogic manual sdc_burn configuration for the s905x5m bootloader package.
; Keep this file ASCII-only.
;
; erase_flash remains zero because this package carries no GPT, boot, or rootfs
; replacement. The external sidecar has the conventional manual name accepted
; by the established vendor sdc_burn path; it is not the private automatic
; installer configuration used by newer replacement U-Boot builds.
;
[common]
erase_bootloader    = 1
erase_flash         = 0
reboot              = 0

[burn_ex]
package             = update.img
