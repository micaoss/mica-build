; The special bootloader destination writes the target-framed eMMC hardware
; boot areas. bootloader_a is the ordinary user-area staging partition. The
; protective GPT makes the vendor storage path skip colliding store copy 0.
; boot and rootfs are deliberately absent: Mica OS continues to run from SD.
