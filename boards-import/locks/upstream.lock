# mica-lock v1
# The third-party trees and archives the boards build from; each board's Makefile reads its rows by name
# (tools/upstream.sh). A pin moves by setting the ref and its commit, or the version, sha256 and url, together.
# The build-env and third-party images come from locks/mica-build-env.lock; the kernel and U-Boot builders
# install nothing, they build FROM the digest-pinned mica-build-env bsp image, which carries the toolchain
# (mica-build-env 20260916-0735; the Ubuntu snapshot pin lives there now).
