# USB CDC ACM debug console gadget for cx3576, reachable whenever a host PC is
# plugged into the OTG port (see otg.conf: mode=otg).
# vid/pid: the Linux Foundation gadget IDs used by the board bring-up rootfs.
name=cx3576_serial
vid=0x0525
pid=0xa4a7
manufacturer=CX3576-Z
product=RK3576 Mica OS debug serial
