# Stable MAC derivation for cx3576.
# Neither NIC has a MAC in hardware: gmac0/eth0's dts node carries no
# mac-address and no nvmem-cells, and the PCIe RTL8168 (eth1) has no EEPROM,
# so the kernel invents a random address for both on every boot.
# seed: read-only hardware identity the address is derived from. The eMMC CID
#   holds the manufacturer, OEM, product name, serial number and production
#   date of the eMMC chip itself; it is unaffected by reflashing the media.
# The other half of the derivation is not configured here and is not meant to
# be: it is the port's own path under /sys/devices, read off
# /sys/class/net/<iface>/device. It is a fact about where the part is attached,
# so there is nothing for a board file to declare -- and until RFCT-359 that
# half was the interface name, which with net.ifnames=0 is probe order and
# nothing else.
seed=/sys/block/mmcblk0/device/cid
