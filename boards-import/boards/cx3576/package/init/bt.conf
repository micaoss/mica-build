# Bluetooth for cx3576 (AIC8800D80, single SKU; BT is HCI-over-UART behind the
# vendor rfkill platform node, not serdev).
# uart: the vendor dtb's wireless-bluetooth node pins its RTS line via the
#   "uart4-gpios" pinctrl and uart4 = serial@2ad70000 (alias serial4, status
#   okay) is the UART wired to the module -> /dev/ttyS4.
# proto: btattach protocol. speed: link rate, only needed by the H:4 path.
#
# Values below are the hardware-verified AIC8800D80 combination taken from the
# board bring-up rootfs: plain H:4 at 1.5 Mbit/s, with the aic8800_btlpm module
# (listed in modules.conf) providing the BT side of the chip. The dual-SKU
# Broadcom patchram fallback was dropped with the AIC-only fleet decision.
uart=/dev/ttyS4
proto=h4
speed=1500000
