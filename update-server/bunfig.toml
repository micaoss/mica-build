[test]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "src/index.ts",
  "src/assets.ts",
  # Drizzle schema callbacks run during SQL generation; migrations are tested.
  "src/db/schema.ts",
  "src/component-fixture.ts",
  # Imported from the build driver, whose own suite (build/run.sh) covers them;
  # this gate measures the update server.
  "../build/src/**"
]
coverageThreshold = { lines = 0.8, functions = 0.8 }
